name: build-commit-windows

on:
  push:
    branches: [main, ci/*]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-commit-windows
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-2025
    env:
      VERSION_NAME: ${{ github.sha }}
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg_cache,readwrite
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: false
          pacboy: gcc:p cmake:p ninja:p make:p

      - name: Restore vcpkg cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: vcpkg-commit-windows-x64-${{ hashFiles('desktop/vcpkg.json') }}
          restore-keys: vcpkg-commit-windows-x64-

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: desktop/vcpkg.json

      - name: Configure
        run: |
          cmake --preset release-mingw \
            -DCMAKE_MAKE_PROGRAM="$MINGW_PREFIX/bin/ninja.exe" \
            -DCMAKE_C_COMPILER="$MINGW_PREFIX/bin/gcc.exe" \
            -DCMAKE_CXX_COMPILER="$MINGW_PREFIX/bin/g++.exe" \
            -DPOCKETWALKER_VERSION="$VERSION_NAME"
        working-directory: desktop

      - name: Build
        run: cmake --build --preset release-mingw
        working-directory: desktop

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocketwalker-windows-x86_64
          path: desktop/build/release-mingw/release/pocketwalker.exe

      - name: Save vcpkg cache
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: vcpkg-commit-windows-x64-${{ hashFiles('desktop/vcpkg.json') }}